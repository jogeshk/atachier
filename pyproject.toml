[project]
name = "atachier"
version = "0.1.0"

description = "A local-first 2D spatial graph document extraction engine that represents documents as elements, geometry, layout, and spatial relationships for structured document understanding."

requires-python = ">=3.10"

license = {text = "MIT"}

authors = [
    {name = "Jogesh"}
]

readme = "README.md"

dependencies = [
    "pypdf>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["atachier", "atachier.*"]
exclude = ["atachier_geometry", "atachier_geometry.*", "tests", "tests.*"]
